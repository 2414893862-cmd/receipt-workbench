  /* 编辑企业时的临时名单（点保存才写回） */
  let coEdit = { items: [], handlers: [] };

  function coTagList(which){
    const arr = which === 'items' ? coEdit.items : coEdit.handlers;
    if (!arr.length){
      return '<span style="font-size:12px;color:var(--hint)">还没有，下面输入名字后点「添加」</span>';
    }
    return arr.map((x, i) => {
      const isH = which === 'handlers';
      const defP = isH && x.default;
      const defD = isH && x.defDrawer;
      return '<span class="tag' + (defP || defD ? ' def' : '') + (x.active === false ? ' off' : '') + '">' +
        esc(x.name) +
        (defP ? '<span class="def-mark">收款</span>' : '') +
        (defD ? '<span class="def-mark">开据</span>' : '') +
        (isH
          ? '<button type="button" class="tbtn star" title="设为默认收款人" onclick="coTagDefault(' + i + ',\'payee\')">' + (defP ? '★收' : '☆收') + '</button>' +
            '<button type="button" class="tbtn star" title="设为默认开据人" onclick="coTagDefault(' + i + ',\'drawer\')">' + (defD ? '★开' : '☆开') + '</button>'
          : '') +
        '<button type="button" class="tbtn" title="' + (x.active === false ? '重新启用' : '停用（历史记录不受影响）') + '"' +
          ' onclick="coTagToggle(' + i + ')">' + (x.active === false ? '启用' : '停用') + '</button>' +
      '</span>';
    }).join('');
  }

  function coTagRender(which){
    const box = $(which === 'items' ? '#cItemsBox' : '#cHandlersBox');
    if (box) box.innerHTML = coTagList(which);
  }

  function coTagAdd(which){
    const input = $(which === 'items' ? '#cItemsNew' : '#cHandlersNew');
    if (!input) return;
    const name = String(input.value || '').trim();
    if (!name) return;
    const arr = which === 'items' ? coEdit.items : coEdit.handlers;
    if (arr.some(x => x.name === name)){ toast('「' + name + '」已经在名单里', true); return; }
    const item = { name: name, active: true };
    if (which === 'handlers'){ item.default = arr.filter(x => x.active !== false).length === 0; item.defDrawer = false; }
    arr.push(item);
    input.value = '';
    coTagRender(which);
    input.focus();
  }

  function coTagToggle(i){
    const arr = coEdit.handlers.some((x, j) => j === i) ? coEdit.handlers : coEdit.items;
    if (!arr[i]) return;
    arr[i].active = arr[i].active === false;
    if (arr === coEdit.handlers && arr[i].active === false){
      ['default', 'defDrawer'].forEach(function(key){
        if (arr[i][key]){
          arr[i][key] = false;
          const next = arr.find(x => x.active !== false);
          if (next) next[key] = true;
        }
      });
    }
    coTagRender(arr === coEdit.handlers ? 'handlers' : 'items');
  }

  function coTagDefault(i, role){
    if (!coEdit.handlers[i]) return;
    const key = role === 'drawer' ? 'defDrawer' : 'default';
    coEdit.handlers.forEach((x, j) => { x[key] = (j === i); });
    coEdit.handlers[i].active = true;
    coTagRender('handlers');
  }

  function saveCompany(id){
    const name = $('#cName').value.trim();
    if (!name){ toast('请填写企业全称', true); return; }
    let prefix = $('#cPrefix').value.trim().toUpperCase() || 'SJ';
    const data = {
      name: name,
      short: $('#cShort').value.trim() || name.slice(0, 6),
      prefix: prefix,
      taxNo: $('#cTax').value.trim(),
      tel: $('#cTel').value.trim(),
      addr: $('#cAddr').value.trim(),
      bank: $('#cBank').value.trim(),
      account: $('#cAccount').value.trim(),
      items: coEdit.items.map(x => ({ name:x.name, active:x.active !== false })),
      handlers: (function(){
        const list = coEdit.handlers.map(x => ({ name:x.name, default:!!x.default, defDrawer:!!x.defDrawer, active:x.active !== false }));
        const act = list.filter(h => h.active !== false);
        if (act.length && !act.some(h => h.default)) act[0].default = true;
        return list;
      })(),
      active: $('#cActive') ? $('#cActive').value === '1' : true
    };

    if (id){
      const c = getCo(id);
      Object.assign(c, data);
    } else {
      const nc = Object.assign({ id: uid(), sealPic:'', createdAt: todayStr() }, data);
      state.companies.push(nc);
      state.currentCompanyId = nc.id;
    }
    save(); closeModal(); render(); toast('企业已保存');
  }

  function deleteCompany(id){
    if (state.receipts.some(r => r.companyId === id)){ toast('该企业已有收据记录，只能停用不能删除', true); return; }
    if (!confirm('确认删除这家企业档案？')) return;
    state.companies = state.companies.filter(c => c.id !== id);
    if (state.currentCompanyId === id) state.currentCompanyId = state.companies[0] ? state.companies[0].id : null;
    save(); closeModal(); render(); toast('已删除');
  }

  function libAdd(){
    const el = $('#libNew');
    const name = el ? String(el.value || '').trim() : '';

    state.itemLib = Array.isArray(state.itemLib) ? state.itemLib : [];
    if (state.itemLib.some(x => x.name === name)){ toast('「' + name + '」已经在库里', true); return; }
    state.itemLib.push({ name:name, active:true });
    save(); render(); toast('已加入全局项目库');
  }

    const x = (state.itemLib || [])[i];

    x.active = x.active === false;

    state.addrLib.push({ name:name, active:true });

    const x = (state.addrLib || [])[i];

  function setSetting(k, v){
    const numeric = { offsetX:1, offsetY:1, scale:1 };
    state.settings[k] = numeric[k] ? num(v) : v;
    if (k === 'scale') state.settings.scale = Math.max(50, Math.min(150, state.settings.scale || 100));
    save();
    if (k === 'paper' || k === 'overlay'){ render(); }
    else if (view === 'new'){ updatePreview(); }
  }
  function resetOffset(){
    state.settings.offsetX = 0;
    state.settings.offsetY = 0;
    state.settings.scale = 100;
    save(); render(); toast('偏移已归零');
  }

  /* ================= 导入导出 ================= */
  function exportCSV(all){
    const list = all ? state.receipts.slice() : filteredReceipts();
    if (!list.length){ toast('没有可导出的记录', true); return; }
    const head = ['日期','收据编号','企业','付款方','地址','房号','电话','缴费年度起','缴费年度止','收费项目','数量','单价','金额','收款方式','开据人','收款人','状态','作废原因','备注'];
    const rows = [];
    list.forEach(r => {
      const co = getCo(r.companyId);
      const base = [r.date, r.no, co ? co.name : '', r.payer, r.addr || '', r.room || '', r.phone || '', r.periodFrom || '', r.periodTo || ''];
      const tail = [r.method, r.drawer || '', r.payee || r.handler || '', r.status === 'void' ? '已作废' : '有效', r.voidReason || '', r.note || ''];
      const items = (r.items && r.items.length) ? r.items : [{ name:'', amt:r.amount }];
      items.forEach(it => {
        rows.push(base.concat([
          it.name || '',
          num(it.qty) || '',
          num(it.price) ? moneyPlain(it.price) : '',
          moneyPlain(it.amt)
        ]).concat(tail));
      });
    });
    const csv = [head].concat(rows).map(line =>
      line.map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(',')
    ).join('\r\n');
    download('\uFEFF' + csv, '收据台账_' + todayStr() + '.csv', 'text/csv;charset=utf-8');
    toast('已导出 ' + rows.length + ' 行明细');
  }

  /* ================= 备份与恢复 ================= */
  const BACKUP_TIP_DAYS = 7;
  let pendingImport = null;

  function stamp(){
    const d = new Date();
    return d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) + '_' + pad(d.getHours()) + pad(d.getMinutes());
  }
  function dateCN(ts){
    if (!ts) return '';
    const d = new Date(num(ts));
    return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()) +
      ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes());
  }

  /* 备份状态：多久没备份、有多少张票是备份之后新增的 */
  function backupStatus(){
    const s = state.settings || {};
    const n = state.receipts.length;
    if (!n) return { level:'none', text:'', days:0, pending:0, last:num(s.lastBackupAt) };
    const last = num(s.lastBackupAt);
    const cnt = num(s.lastBackupCount);
    if (!last) return { level:'warn', text:'还没备份过', days:0, pending:n, last:0 };
    const days = Math.floor((Date.now() - last) / 86400000);
    const pending = Math.max(0, n - cnt);
    const level = (days >= BACKUP_TIP_DAYS || pending >= 10) ? 'warn' : 'ok';
    let text = days <= 0 ? '今天已备份' : (days + ' 天前备份过');
    if (pending > 0) text += ' · 新增 ' + pending + ' 张';
    return { level, text, days, pending, last };
  }

  function exportJSON(){
    const payload = {
      app: '收据工作台',
      kind: 'backup',
      schema: 2,
      exportedAt: new Date().toISOString(),
      counts: { companies: state.companies.length, receipts: state.receipts.length },
      state: state
    };
    download(JSON.stringify(payload, null, 2), '收据工作台备份_' + stamp() + '.json', 'application/json');
    state.settings.lastBackupAt = Date.now();
    state.settings.lastBackupCount = state.receipts.length;
    save();
    refreshBackupUI();
    toast('备份已导出：' + state.companies.length + ' 家企业 / ' + state.receipts.length + ' 张收据');
  }

  /* 企业档案包：只带抬头/项目/经手人/地址库，不带收据 —— 发给同事开箱就有档案 */
  function exportProfile(){
    const s = state.settings;
    const payload = {
      app: '收据工作台',
      kind: 'profile',
      schema: 2,
      exportedAt: new Date().toISOString(),
      counts: { companies: state.companies.length, receipts: 0 },
      state: {
        version: 2,
        companies: JSON.parse(JSON.stringify(state.companies || [])),
        itemLib: JSON.parse(JSON.stringify(state.itemLib || [])),
        addrLib: JSON.parse(JSON.stringify(state.addrLib || [])),
        receipts: [],
        settings: {
          paper: s.paper, overlay: s.overlay,
          offsetX: s.offsetX, offsetY: s.offsetY, scale: s.scale,
          showFrame: s.showFrame, showFootNote: s.showFootNote
        },
        currentCompanyId: null
      }
    };
    download(JSON.stringify(payload, null, 2), '收据工作台_企业档案_' + stamp() + '.json', 'application/json');
    toast('档案包已导出：' + state.companies.length + ' 家企业（不含收据）');
  }

  function unpackBackup(d){
    if (!d || typeof d !== 'object') return null;
    if (d.kind && d.state) return { kind:d.kind, exportedAt:d.exportedAt || '', counts:d.counts || {}, state:d.state, raw:d };
    if (Array.isArray(d.companies)) return { kind:'backup', exportedAt:'', counts:{ companies:d.companies.length, receipts:(d.receipts || []).length }, state:d, raw:d };
    return null;
  }

  /* 读一个备份文件：直接给 File 就处理，不给就弹选择框（也方便以后接拖拽） */
  function readBackupFile(f){
    if (!f) return;
    const rd = new FileReader();
    rd.onload = function(e){
      let d;
      try{ d = JSON.parse(e.target.result); }
      catch(err){ toast('这不是有效的备份文件（读取失败）', true); return; }
      const pack = unpackBackup(d);
      if (!pack){ toast('文件格式不认识，不是本工具导出的备份', true); return; }
      const st = normalizeState(JSON.parse(JSON.stringify(pack.state)));
      if (!st){ toast('备份内容不完整（缺少企业档案）', true); return; }
      pendingImport = { pack, state: st };
      openModal('导入备份', importConfirmHTML(pendingImport), importFootHTML(pendingImport));
    };
    rd.readAsText(f, 'utf-8');
  }

  function importJSON(file){
    if (file){ readBackupFile(file); return; }
    const inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json,application/json';
    inp.onchange = function(){ readBackupFile(inp.files && inp.files[0]); };
    inp.click();
  }

  function importConfirmHTML(p){
    const st = p.state;
    const isProfile = p.pack.kind === 'profile';
    const rows = [
      ['文件类型', isProfile ? '企业档案包（不含收据）' : '完整备份'],
      ['导出时间', p.pack.exportedAt ? dateCN(new Date(p.pack.exportedAt).getTime()) : '未知'],
      ['包含', st.companies.length + ' 家企业 · ' + st.receipts.length + ' 张收据 · ' + (st.itemLib || []).length + ' 个项目 · ' + (st.addrLib || []).length + ' 个地址'],
      ['本机现有', state.companies.length + ' 家企业 · ' + state.receipts.length + ' 张收据']
    ];
    return '<div style="font-size:13px;line-height:1.9;margin-bottom:14px">' +
        rows.map(r => '<div><span style="color:#7b8794;display:inline-block;width:80px">' + r[0] + '</span>' + esc(r[1]) + '</div>').join('') +
      '</div>' +
      '<div class="note-box">' +
        '<b>合并</b>：本机已有的不动，把文件里缺的企业 / 收据 / 项目 / 地址补进来，两边都有的按较新的算。适合「同事那边也录了一些」「从另一台电脑汇总」。<br>' +
        '<b>覆盖</b>：本机数据全部换成文件里的。覆盖前会自动留一份，可以在设置页点「撤销上次导入」找回。' +
      '</div>';
  }
  function importFootHTML(p){
    return '<button class="btn" onclick="closeModal()">取消</button>' +
      '<button class="btn" onclick="doImport(\'replace\')">覆盖本机数据</button>' +
      '<button class="btn primary" onclick="doImport(\'merge\')">合并进来</button>';
  }

  function mergeNameList(a, b, log, key){
    const out = Array.isArray(a) ? a.slice() : [];
    const has = {};
    out.forEach(x => { if (x && x.name) has[x.name] = x; });
    (Array.isArray(b) ? b : []).forEach(x => {
      if (!x || !x.name) return;
      if (!has[x.name]){
        out.push({ name:x.name, active:x.active !== false, default: !!x.default });
        has[x.name] = out[out.length - 1];
        if (log) log[key] = (log[key] || 0) + 1;
      } else if (has[x.name].active === false && x.active !== false){
        has[x.name].active = true;   /* 任一边启用就算启用 */
      }
    });
    return out;
  }

  function mergeState(dst, src){
    const log = { companies:0, receipts:0, items:0, handlers:0, addrs:0, updated:0 };
    (src.companies || []).forEach(sc => {
      const cur = (dst.companies || []).find(c => c.id === sc.id) ||
                  (dst.companies || []).find(c => c.name && c.name === sc.name);
      if (!cur){
        dst.companies.push(JSON.parse(JSON.stringify(sc)));
        log.companies++;
        return;
      }
      /* 同名/同 id：抬头以本机为准，只把项目、经手人合并过来 */
      cur.items = mergeNameList(cur.items, sc.items, log, 'items');
      cur.handlers = mergeNameList(cur.handlers, sc.handlers, log, 'handlers');
    });
    dst.itemLib = mergeNameList(dst.itemLib, src.itemLib, log, 'items');
    dst.addrLib = mergeNameList(dst.addrLib, src.addrLib, log, 'addrs');

    const byId = {};
    (dst.receipts || []).forEach(r => { byId[r.id] = r; });
    (src.receipts || []).forEach(sr => {
      const cur = byId[sr.id];
      if (!cur){
        const copy = JSON.parse(JSON.stringify(sr));
        dst.receipts.push(copy);
        byId[sr.id] = copy;
        log.receipts++;
        return;
      }
      const a = String(cur.updatedAt || cur.createdAt || '');
      const b = String(sr.updatedAt || sr.createdAt || '');
      if (b > a){ Object.assign(cur, JSON.parse(JSON.stringify(sr))); log.updated++; }
    });
    return log;
  }

  function dupNos(){
    const seen = {}, dup = [];
    (state.receipts || []).forEach(r => {
      const k = r.no;
      if (!k) return;
      if (seen[k]) dup.push(k); else seen[k] = 1;
    });
    return dup;
  }

  function doImport(mode){
    const p = pendingImport;
    if (!p) return;
    const src = p.state;
    migrate(src);

    if (mode === 'merge'){
      const log = mergeState(state, src);
      const parts = [];
      if (log.companies) parts.push('新企业 ' + log.companies);
      if (log.receipts) parts.push('新收据 ' + log.receipts);
      if (log.updated) parts.push('更新 ' + log.updated);
      if (log.items) parts.push('新项目 ' + log.items);
      if (log.addrs) parts.push('新地址 ' + log.addrs);
      if (!parts.length) parts.push('没有新内容');
      toast('合并完成：' + parts.join(' · '));
    } else {
      /* 覆盖前留一份，后悔了能撤 */
      try{ localStorage.setItem(KEY + '_preimport', JSON.stringify(state)); }catch(e){}
      const curCo = state.currentCompanyId;
      state = src;
      state.settings = Object.assign(blankState().settings, src.settings || {});
      state.settings.copies = 1;
      if (!getCo(curCo) && getCo(state.companies[0] && state.companies[0].id)) state.currentCompanyId = state.companies[0].id;
      toast('已恢复：' + state.receipts.length + ' 张收据');
    }

    if (!state.currentCompanyId || !getCo(state.currentCompanyId)){
      state.currentCompanyId = (state.companies[0] || {}).id || null;
    }
    save();
    pendingImport = null;
    closeModal();
    editId = null;
    if (view === 'new') render(); else render();
    const dup = dupNos();
    if (dup.length) setTimeout(() => toast('有 ' + dup.length + ' 个编号重复，台账里会看到，建议检查', true), 900);
  }

  function hasPreimport(){
    try{ return !!localStorage.getItem(KEY + '_preimport'); }catch(e){ return false; }
  }
  function undoImport(){
    let raw = null;
    try{ raw = localStorage.getItem(KEY + '_preimport'); }catch(e){}
    if (!raw){ toast('没有可撤销的导入记录', true); return; }
    if (!confirm('把数据恢复到「上一次导入覆盖之前」的状态？当前数据会被替换，建议先导出备份。')) return;
    try{
      const d = normalizeState(JSON.parse(raw));
      if (!d){ toast('撤销失败：记录已损坏', true); return; }
      state = d; migrate(state);
      if (!getCo(state.currentCompanyId)) state.currentCompanyId = (state.companies[0] || {}).id || null;
      save();
      localStorage.removeItem(KEY + '_preimport');
      render();
      toast('已撤销上次导入');
    }catch(e){ toast('撤销失败：' + e.message, true); }
  }

  function wipeAll(){
    if (!confirm('确定清空全部企业档案和收据记录？此操作不可撤销，建议先导出备份。')) return;
    if (!confirm('再确认一次：真的要清空吗？')) return;
    try{ localStorage.setItem(KEY + '_prewipe', JSON.stringify(state)); }catch(e){}
    state = blankState();
    state.currentCompanyId = state.companies[0].id;
    save(); render(); toast('已清空（清空前那份数据仍在浏览器里，紧急时可找回）');
  }

  function refreshBackupUI(){
    renderTopActions();
    const el = $('#bkState');
    if (el) el.innerHTML = backupLineHTML();
    const undoBtn = $('#undoImportBtn');
    if (undoBtn) undoBtn.style.display = hasPreimport() ? '' : 'none';
  }

  function backupLineHTML(){
    const bs = backupStatus();
    const s = state.settings;
    const last = num(s.lastBackupAt);
    if (!last) return '<b style="color:#a06112">还没有导出过备份</b>';
    return '上次导出：' + dateCN(last) + '（当时 ' + num(s.lastBackupCount) + ' 张）';
  }

  function download(content, filename, mime){
    const blob = new Blob([content], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 300);
  }

  /* ================= 弹层 ================= */
  function openModal(title, body, foot, boxCls){
    $('#modalTitle').textContent = title;
    $('#modalBody').innerHTML = body;
    $('#modalFoot').innerHTML = foot || '';
    const box = $('#modal .modal-box');
    if (box) box.className = 'modal-box' + (boxCls ? ' ' + boxCls : '');
    $('#modal').classList.add('show');
  }
  function closeModal(){
    $('#modal').classList.remove('show');
    const box = $('#modal .modal-box');
    if (box) box.className = 'modal-box';   /* 收据预览用的宽弹层，关掉就还原 */
  }

  /* ================= 绑定 ================= */
  $('#nav').addEventListener('click', function(e){
    const b = e.target.closest('button[data-view]');
    if (b) switchView(b.dataset.view);
  });
  $('#companySelect').addEventListener('change', function(){
    const v = this.value;
    state.currentCompanyId = v;
    save(); renderCompanySelect();
    if (view === 'new' && !editId){
      const f2 = $('#fCompany');
      if (f2) f2.value = v;
      onCompanyChange();
    }
  });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape') closeModal();
    if ((e.ctrlKey || e.metaKey) && e.key === 's' && view === 'new'){ e.preventDefault(); saveReceipt(); }
  });
  /* 预览缩放：Ctrl + 滚轮；窗口尺寸变了重新适配 */
  document.addEventListener('wheel', pvWheel, { passive:false });
  let pvResizeT = null;
  window.addEventListener('resize', function(){
    if (view !== 'new') return;
    clearTimeout(pvResizeT);
    pvResizeT = setTimeout(pvApply, 120);
  });
  $('#modal').addEventListener('click', function(e){ if (e.target === this) closeModal(); });

  /* 对外暴露 */
  window.switchView = switchView;
  window.addItem = addItem;
  window.delItem = delItem;
  window.resetForm = resetForm;
  window.cancelEdit = cancelEdit;
  window.saveReceipt = saveReceipt;
  window.setFilter = setFilter;
  window.clearFilter = clearFilter;
  window.printOne = printOne;
  window.printNameOf = printNameOf;
  window.previewReceipt = previewReceipt;
  window.previewPrint = previewPrint;
  window.editReceipt = editReceipt;
  window.voidReceipt = voidReceipt;
  window.doVoid = doVoid;
  window.restoreReceipt = restoreReceipt;
  window.openCompanyEdit = openCompanyEdit;
  window.saveCompany = saveCompany;
  window.deleteCompany = deleteCompany;
  window.setSetting = setSetting;
  window.resetOffset = resetOffset;
  window.printCalibration = printCalibration;
  window.libAdd = libAdd;
  window.libToggle = libToggle;
  window.addrAdd = addrAdd;
  window.addrToggle = addrToggle;
  window.comboInput = comboInput;
  window.comboOpen = comboOpen;
  window.comboBlur = comboBlur;
  window.comboToggle = comboToggle;
  window.comboPick = comboPick;
  window.comboNew = comboNew;
  window.comboDisable = comboDisable;
  window.comboKey = comboKey;
  window.coTagAdd = coTagAdd;
  window.coTagToggle = coTagToggle;
  window.coTagDefault = coTagDefault;
  window.updatePreview = updatePreview;
  window.refreshTotals = refreshTotals;
  window.exportCSV = exportCSV;
  window.exportJSON = exportJSON;
  window.importJSON = importJSON;
  window.readBackupFile = readBackupFile;
  window.exportProfile = exportProfile;
  window.doImport = doImport;
  window.undoImport = undoImport;
  window.wipeAll = wipeAll;
  window.closeModal = closeModal;
  window.jumpLedger = jumpLedger;
  window.pvZoom = pvZoom;
  window.pvFitClick = pvFitClick;
  window.setStatsCo = setStatsCo;

  render();

  /* 启动提示：上次主数据读坏了、已用快照救回；或很久没备份 */
  if (recoveredFromBak){
    setTimeout(() => toast('上次的数据有损坏，已自动从快照恢复。建议现在导出一份备份。', true), 600);
  } else {
    const bs = backupStatus();
    if (bs.level === 'warn' && bs.last && bs.days >= BACKUP_TIP_DAYS){
      setTimeout(() => toast('已经 ' + bs.days + ' 天没备份了，点右上角圆点导出一份', false), 800);
    }
  }
})();
